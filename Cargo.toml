[package]
name = "glyphr"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight Google Fonts discovery & silent desktop engine"
authors = ["Glyphr Contributors"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
directories = "5.0"
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
